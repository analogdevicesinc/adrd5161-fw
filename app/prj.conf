# This file contains selected Kconfig options for the application.

CONFIG_GPIO=y

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=y

# Enable I2C
CONFIG_I2C=y

CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_MAX17320=y
CONFIG_MFD=y
CONFIG_CHARGER=y
CONFIG_CHARGER_MAX77961=y
CONFIG_SENSOR=y
CONFIG_SENSOR_MAX31827=y
CONFIG_SHELL=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_I2C_MAX32_INTERRUPT=y

# CAN & CANopen
CONFIG_CAN=y
CONFIG_CANOPEN=y
CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_CONFIG_FILE="CO_config_custom.h"
CONFIG_CANOPENNODE_MAINLINE_THREAD_STACK_SIZE=2048
CONFIG_CANOPENNODE_SYNC_THREAD_STACK_SIZE=2048
#CONFIG_CAN_LOG_LEVEL_DBG=y
#CONFIG_CANOPEN_LOG_LEVEL_DBG=y
CONFIG_CANOPENNODE_LEDS_USE_GPIO=n
CONFIG_CANOPENNODE_LEDS_USE_CALLBACK=n
#CONFIG_CANOPENNODE_THREAD_STACK_SIZE=4096

CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_WDT_MAX32=y


CONFIG_SMF=y
# CONFIG_DEBUG_THREAD_INFO=y